<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="57x57" href="images/apple-icon-57x57.png">
<link rel="apple-touch-icon" sizes="60x60" href="images/apple-icon-60x60.png">
<link rel="apple-touch-icon" sizes="72x72" href="images/apple-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="images/apple-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="images/apple-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="images/apple-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="images/apple-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="images/apple-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192"  href="images/android-icon-192x192.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="manifest" href="images/manifest.json">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="images/ms-icon-144x144.png">
<meta name="theme-color" content="#ffffff">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My thoughts and playlist</title>

  <style>
    :root {
      --white: #ffffff;
      --muted-white: rgba(255, 255, 255, 0.72);
      --glass-black: rgba(0, 0, 0, 0.68);
      --border: rgba(255, 255, 255, 0.25);
      --accent: #dcecff;
    }

    * {
      box-sizing: border-box;
    }

  body {
  min-height: 100vh;
  margin: 0;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;

  /* لایه تیره روی تصویر + تصویر پس‌زمینه */
  background-image:
    linear-gradient(
      rgba(0, 0, 0, 0.35),
      rgba(0, 0, 0, 0.6)
    ),
    url("images/download.jpg");

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

    /* Snow layer */
    .snow {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .snowflake {
      position: absolute;
      top: -40px;
      color: #fff;
      font-size: var(--size);
      opacity: var(--opacity);
      filter: blur(var(--blur));
      animation: snowfall var(--duration) linear var(--delay) infinite;
    }

    @keyframes snowfall {
      0% {
        transform: translate3d(0, -10vh, 0) rotate(0deg);
      }

      50% {
        transform: translate3d(var(--drift), 50vh, 0) rotate(180deg);
      }

      100% {
        transform: translate3d(calc(var(--drift) * -1), 110vh, 0) rotate(360deg);
      }
    }

    .page {
      position: relative;
      z-index: 2;
      width: min(100% - 32px, 850px);
      margin: 0 auto;
      padding: 70px 0;
    }

    .intro {
      margin-bottom: 28px;
      text-align: center;
    }

    .intro h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.7);
    }

    .intro p {
      margin: 0;
      color: var(--muted-white);
      font-size: 1rem;
    }

    .section-title {
      margin: 0 0 18px;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Square updates panel */
    .updates-panel {
      width: min(100%, 650px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 32px;
      padding: clamp(22px, 5vw, 42px);
      display: flex;
      flex-direction: column;
      background: var(--glass-black);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(7px);
    }

    .updates-list {
      flex: 1;
      min-height: 0;
      margin-bottom: 18px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .updates-list::-webkit-scrollbar {
      width: 6px;
    }

    .updates-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.35);
      border-radius: 20px;
    }

    .update {
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .update:first-child {
      padding-top: 0;
    }

    .update p {
      margin: 0 0 7px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .update time {
      color: var(--muted-white);
      font-size: 0.78rem;
    }

    .update-form {
      display: grid;
      gap: 10px;
    }

    .update-form textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      padding: 12px;
      color: var(--white);
      font: inherit;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border);
      outline: none;
    }

    .update-form textarea::placeholder {
      color: rgba(255, 255, 255, 0.62);
    }

    .update-form textarea:focus {
      border-color: var(--white);
    }

    .button {
      border: 1px solid var(--white);
      padding: 11px 16px;
      color: #000;
      background: var(--white);
      cursor: pointer;
      font: inherit;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .button:hover {
      color: var(--white);
      background: transparent;
    }

    /* Playlist */
    .playlist-panel {
      padding: clamp(22px, 5vw, 36px);
      background: var(--glass-black);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(7px);
    }

    .player {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .now-playing {
      min-width: 0;
    }

    .now-playing strong,
    .now-playing span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .now-playing strong {
      margin-bottom: 5px;
    }

    .now-playing span {
      color: var(--muted-white);
      font-size: 0.85rem;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      padding: 0;
      color: var(--white);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s ease;
    }

    .icon-button:hover {
      color: #000;
      background: var(--white);
    }

    .play-button {
      width: 48px;
      height: 48px;
      color: #000;
      background: var(--white);
      border-color: var(--white);
      font-size: 1.15rem;
    }

    .play-button:hover {
      color: var(--white);
      background: transparent;
    }

    .volume {
      width: 95px;
      accent-color: var(--white);
      cursor: pointer;
    }

    .progress-area {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      gap: 10px;
      color: var(--muted-white);
      font-size: 0.78rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--white);
      cursor: pointer;
    }

    .track-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .track {
      width: 100%;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      color: var(--white);
      text-align: left;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .track:hover,
    .track.active {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--border);
    }

    .track-number {
      color: var(--muted-white);
      font-size: 0.85rem;
    }

    .track-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-artist {
      color: var(--muted-white);
      font-size: 0.82rem;
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 22px, 850px);
        padding: 42px 0;
      }

      .updates-panel {
        aspect-ratio: auto;
        min-height: 560px;
      }

      .player {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .now-playing {
        width: 100%;
        text-align: center;
      }

      .progress-area {
        width: 100%;
      }

      .volume {
        width: 120px;
      }

      .track {
        grid-template-columns: 28px 1fr;
      }

      .track-artist {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <main class="page">
    <header class="intro">
      <h1>my memories space</h1>
      <p>A place for updates, thoughts, and music.</p>
    </header>

    <section class="updates-panel" aria-labelledby="updates-title">
      <h2 class="section-title" id="updates-title">How <a style="color: #fff;" href="https://t.me/Qrast">I'm</a> Doing</h2>

      <div class="updates-list" id="updatesList" aria-live="polite">

        <article class="update">
          <p>Autumn has begun I hope you feel better.I’m feeling really bad right now.</p>
          <time datetime="2024-12-31">Today</time>
        </article>
         <article class="update">
          <p>There are so many thoughts in my head they never end.</p>
          <time datetime="2024-12-31">Today</time>
        </article>
      </div>

      
    </section>

    <section class="playlist-panel" aria-labelledby="playlist-title">
      <h2 class="section-title" id="playlist-title">My Playlist</h2>

      <div class="player">
        <div class="player-controls">
          <button class="icon-button" id="previousButton" type="button" aria-label="Previous track">
            ‹
          </button>

          <button class="icon-button play-button" id="playButton" type="button" aria-label="Play">
            ▶
          </button>

          <button class="icon-button" id="nextButton" type="button" aria-label="Next track">
            ›
          </button>
        </div>

        <div class="now-playing">
          <strong id="trackTitle">Choose a song</strong>
          <span id="trackArtist">Your playlist</span>
        </div>

        <input
          class="volume"
          id="volumeControl"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.8"
          aria-label="Volume"
        />

        <div class="progress-area">
          <span id="currentTime">0:00</span>

          <input
            id="progressControl"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-label="Track progress"
          />

          <span id="duration">0:00</span>
        </div>
      </div>

      <ol class="track-list" id="trackList"></ol>
    </section>
  </main>

  <script>
    /*
      Replace these sample paths with your own audio files.

      Example:
      src: "music/my-song.mp3"
    */
    const tracks = [
      {
        title: "DEMONS",
        artist: "VAYNE",
        src: "musics/DEMONS.mp3"
      },
      {
        title: "ICEMOOD",
        artist: "LILTVHM",
        src: "musics/Ice Mood.mp3"
      },
      {
        title: "UNO",
        artist: "AMINAK",
        src: "musics/uno.mp3"
      }
    ];

    const audio = new Audio();
    audio.volume = 0.8;

    const playButton = document.getElementById("playButton");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const volumeControl = document.getElementById("volumeControl");
    const progressControl = document.getElementById("progressControl");
    const currentTimeDisplay = document.getElementById("currentTime");
    const durationDisplay = document.getElementById("duration");
    const trackTitle = document.getElementById("trackTitle");
    const trackArtist = document.getElementById("trackArtist");
    const trackList = document.getElementById("trackList");

    let currentTrack = 0;

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

      return `${minutes}:${remainingSeconds}`;
    }

    function renderTracks() {
      trackList.innerHTML = tracks
        .map(
          (track, index) => `
            <li>
              <button class="track ${index === currentTrack ? "active" : ""}"
                type="button"
                data-index="${index}">
                <span class="track-number">${String(index + 1).padStart(2, "0")}</span>
                <span class="track-name">${track.title}</span>
                <span class="track-artist">${track.artist}</span>
              </button>
            </li>
          `
        )
        .join("");
    }

    function loadTrack(index, autoplay = false) {
      currentTrack = (index + tracks.length) % tracks.length;
      const track = tracks[currentTrack];

      audio.src = track.src;
      audio.load();

      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      progressControl.value = 0;
      currentTimeDisplay.textContent = "0:00";
      durationDisplay.textContent = "0:00";

      renderTracks();

      if (autoplay) {
        audio.play().catch(() => {
          // Browsers may block playback until the user interacts with the page.
        });
      }
    }

    function updatePlayButton() {
      const isPlaying = !audio.paused;

      playButton.textContent = isPlaying ? "Ⅱ" : "▶";
      playButton.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
    }

    playButton.addEventListener("click", () => {
      if (!audio.src) {
        loadTrack(0);
      }

      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    previousButton.addEventListener("click", () => {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadTrack(currentTrack - 1, true);
      }
    });

    nextButton.addEventListener("click", () => {
      loadTrack(currentTrack + 1, true);
    });

    volumeControl.addEventListener("input", () => {
      audio.volume = volumeControl.value;
    });

    progressControl.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime =
          (progressControl.value / 100) * audio.duration;
      }
    });

    audio.addEventListener("play", updatePlayButton);
    audio.addEventListener("pause", updatePlayButton);

    audio.addEventListener("loadedmetadata", () => {
      durationDisplay.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      currentTimeDisplay.textContent = formatTime(audio.currentTime);

      if (audio.duration) {
        progressControl.value =
          (audio.currentTime / audio.duration) * 100;
      }
    });

    audio.addEventListener("ended", () => {
      loadTrack(currentTrack + 1, true);
    });

    trackList.addEventListener("click", (event) => {
      const trackButton = event.target.closest(".track");
      if (!trackButton) return;

      loadTrack(Number(trackButton.dataset.index), true);
    });

    // Updates form
    const updateForm = document.getElementById("updateForm");
    const updateText = document.getElementById("updateText");
    const updatesList = document.getElementById("updatesList");

    updateForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = updateText.value.trim();
      if (!text) return;

      const update = document.createElement("article");
      update.className = "update";

      const paragraph = document.createElement("p");
      paragraph.textContent = text;

      const time = document.createElement("time");
      time.textContent = "Just now";
      time.dateTime = new Date().toISOString();

      update.append(paragraph, time);
      updatesList.prepend(update);

      updateText.value = "";
      updateText.focus();
    });

    // Generate animated snowflakes
    const snowContainer = document.getElementById("snow");
    const snowflakeSymbols = ["❄", "❅", "❆", "•"];

    for (let i = 0; i < 70; i++) {
      const snowflake = document.createElement("span");

      snowflake.className = "snowflake";
      snowflake.textContent =
        snowflakeSymbols[Math.floor(Math.random() * snowflakeSymbols.length)];

      snowflake.style.left = `${Math.random() * 100}%`;
      snowflake.style.setProperty("--size", `${8 + Math.random() * 18}px`);
      snowflake.style.setProperty("--opacity", `${0.25 + Math.random() * 0.7}`);
      snowflake.style.setProperty("--blur", `${Math.random() * 1.5}px`);
      snowflake.style.setProperty(
        "--duration",
        `${8 + Math.random() * 14}s`
      );
      snowflake.style.setProperty(
        "--delay",
        `${Math.random() * -20}s`
      );
      snowflake.style.setProperty(
        "--drift",
        `${-80 + Math.random() * 160}px`
      );

      snowContainer.appendChild(snowflake);
    }

    loadTrack(0);
  </script>
</body>
</html>
